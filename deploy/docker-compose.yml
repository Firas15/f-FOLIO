# Портфолио на сервере GameCode: отдельный compose-проект, своя сеть-подключение к nginx GameCode.
# Запуск (из /opt/portfolio):  docker compose -f deploy/docker-compose.yml up -d --build
name: portfolio
services:
  web:
    build: .
    container_name: portfolio-web
    restart: unless-stopped
    expose: ["80"]               # наружу порт не публиковать
    volumes:
      - ..:/var/www/html:ro      # код из git: после git pull обновляется сразу, пересборка не нужна
      # то, что пишет админка, лежит ВНЕ git, поэтому git pull ничего не затирает и не конфликтует
      - /opt/portfolio-data/portfolio.js:/var/www/html/data/portfolio.js
      - /opt/portfolio-data/storage:/var/www/html/admin/storage
      - /opt/portfolio-data/uploads:/var/www/html/assets/img/uploads
    networks: [gamecode]
networks:
  gamecode:
    external: true
    name: gamecode_default

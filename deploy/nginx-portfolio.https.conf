# Этап 2: HTTPS (после выпуска сертификата). Заменяет portfolio.conf
server {
    listen 80;
    server_name f-folio.ru www.f-folio.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://f-folio.ru$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name www.f-folio.ru;
    ssl_certificate     /etc/letsencrypt/live/f-folio.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/f-folio.ru/privkey.pem;
    return 301 https://f-folio.ru$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name f-folio.ru;
    ssl_certificate     /etc/letsencrypt/live/f-folio.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/f-folio.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 24m;    # загрузка фото в админке
    location / {
        # если контейнер портфолио остановлен, nginx (и GameCode) всё равно стартует
        resolver 127.0.0.11 valid=10s;
        set $up http://portfolio-web:80;
        proxy_pass $up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
